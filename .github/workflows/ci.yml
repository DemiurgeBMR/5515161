name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: none

      - name: Проверка синтаксиса PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Страницы открываются
        run: |
          php -S 127.0.0.1:8090 -t public > /tmp/server.log 2>&1 &
          sleep 1
          for page in / /rules.php /privacy.php /consent.php /sitemap.xml; do
            path="$page"; [ "$page" = /sitemap.xml ] && path=/sitemap.php
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8090$path")
            echo "$page → $code"
            [ "$code" = 200 ] || { cat /tmp/server.log; exit 1; }
            if grep -qiE 'Fatal error|Warning:|Notice:|Deprecated:' /tmp/page.html; then cat /tmp/page.html; exit 1; fi
          done
