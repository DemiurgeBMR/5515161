<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
<title id="title">Гостиница Неаполь</title><desc id="desc">Золотая геометрическая эмблема и надпись Гостиница Неаполь на прозрачном фоне</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d28b"/><stop offset=".28" stop-color="#c88a36"/><stop offset=".58" stop-color="#f4c56f"/><stop offset=".82" stop-color="#a96522"/><stop offset="1" stop-color="#e9b65d"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0b7"/><stop offset=".45" stop-color="#c88b3c"/><stop offset="1" stop-color="#784316"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset dy="6" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round">
 <path d="M35 365 265 38 420 260 365 320 265 155 145 365Z" fill="url(#gold)" filter="url(#grain)"/>
 <path d="M220 365 335 205 390 275 350 330 315 365Z" fill="url(#gold)" filter="url(#grain)"/>
 <path d="M390 365 470 265 620 365Z" fill="url(#gold)" filter="url(#grain)"/>
</g>
<text x="432" y="247" fill="url(#gold)" stroke="#9a6126" stroke-width="1.4" paint-order="stroke" font-family="Arial,sans-serif" font-size="35" font-weight="800" letter-spacing="1">ГОСТИНИЦА</text>
<text x="350" y="475" text-anchor="middle" fill="url(#gold)" stroke="#9a6126" stroke-width="2" paint-order="stroke" font-family="Arial,sans-serif" font-size="100" font-weight="900" letter-spacing="2">НЕАПОЛЬ</text>
</svg>