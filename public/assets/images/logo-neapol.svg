<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Гостиница Неаполь</title>
<desc id="desc">Золотая геометрическая эмблема гостиницы Неаполь и надписи на прозрачном фоне.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#ffe6a0"/>
    <stop offset=".18" stop-color="#d9942f"/>
    <stop offset=".38" stop-color="#ffcf69"/>
    <stop offset=".58" stop-color="#b66c1d"/>
    <stop offset=".78" stop-color="#f6bd55"/>
    <stop offset="1" stop-color="#9d5818"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#fff0bd"/><stop offset=".48" stop-color="#b87522"/><stop offset="1" stop-color="#70400f"/>
  </linearGradient>
  <filter id="depth" x="-8%" y="-8%" width="116%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feOffset dy="2" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#depth)" stroke="url(#edge)" stroke-width="2.4" stroke-linejoin="miter">
  <path d="M92 290 296 15 398 156 368 191 296 97 190 238 233 238 296 151 328 196 260 290Z" fill="url(#gold)"/>
  <path d="M342 240 460 240 505 290 304 290Z" fill="url(#gold)"/>
</g>
<text x="342" y="230" fill="url(#gold)" stroke="#8c5119" stroke-width="1.2" paint-order="stroke" font-family="Arial,sans-serif" font-size="27" font-weight="900" letter-spacing=".4">ГОСТИНИЦА</text>
<text x="300" y="360" text-anchor="middle" fill="url(#gold)" stroke="#8c5119" stroke-width="2" paint-order="stroke" font-family="Arial,sans-serif" font-size="69" font-weight="900" letter-spacing="1.5">НЕАПОЛЬ</text>
</svg>